schema_version: "1.1"
name: close-cancelled-handoff
description: After a cancelled goal, Claude proposed a handoff and the human says to write it. Claude writes it, and its next goal opens a conversation about what to do instead.
tags: [guardrail, close]
runs: 5
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: Yes, write it.
  max_turns: 8
  allowed_tools:
    [mcp__zg__close_goal, mcp__zg__action, mcp__zg__handoff, mcp__zg__show]
graders:
  - name: handoff-written-about-what-to-do-instead
    type: tool_used
    tool: mcp__zg__handoff
    input_match: '"next":\s*"[^"]*([Ii]nstead|[Oo]therwise|[Aa]lternative|[Ss]tart(ing)? over|[Ww]hat to do)'
    min: 1
  - name: handoff-written
    type: regex
    target: {source: file, path: .zg/sessions/84484670-58dd-40e4-b4e5-f49aca88d32b.jsonl}
    pattern: '"type":"HandoffWritten"'
    match: contains
