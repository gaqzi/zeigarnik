schema_version: "1.1"
name: up-parent-close
description: The human answers T6, Claude's own question about the bus or a taxi from the airport, and T6 is the last open child of T2 "Places in Greece". Claude records the answer and resolves T6 with the human's words as the reason (source chat), leaves T2 open, and ends its message by asking whether T2 can close (zg-4h7, what follows from an outcome is proposed, never cascaded). Guardrails are T2 never resolved, T6 resolved from chat, and a resolve reason that is a contiguous piece of the message, so nothing is invented. Its behaviour is the question about T2, which no log assertion can show, so an llm grader checks Claude's last message. The case has no no-plugin arm, because the runner yields only the with arm for a resumed case, so its baseline is the with arm. Not exercised - the asking turn (T6's question was Claude's and is in the recorded history; the human's answer is the prompt), the setup turns (recorded, steered by setup prompts, not live), the follow-on line in the tool result (zg-bam.6.1's own tests prove it), and a reply logged on T2 for Claude's proposal (not asserted).
tags: [guardrail, slice-4, propagation]
runs: 5
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: "T6: the bus, 40 min is fine"
  max_turns: 10
  allowed_tools:
    [
      mcp__zg__decision,
      mcp__zg__criterion,
      mcp__zg__node,
      mcp__zg__thread,
      mcp__zg__show,
    ]
graders:
  # Guardrail. T2 stays open: Claude proposes its close and waits for the
  # human. The line is picked by per-line lookaheads on its fields
  # ((?<![^\n]) is the line start), so the order of fields does not matter.
  # The closing quote keeps T2 from matching T20.
  - name: T2-not-resolved
    type: regex
    target: {source: file, path: .zg/sessions/06ecd14d-ec76-4f54-90ae-a88aaf6f0e07.jsonl}
    pattern: '(?<![^\n])(?=[^\n]*"type":"ThreadResolved")(?=[^\n]*"thread":"T2")'
    match: not_contains
  # Guardrail. T6 resolves from the human's chat words: source chat, the
  # phrase inside the reason, an outcome given. A key such as "reason":" cannot
  # match inside another string, where its quotes are escaped.
  - name: T6-resolved-with-the-humans-words
    type: regex
    target: {source: file, path: .zg/sessions/06ecd14d-ec76-4f54-90ae-a88aaf6f0e07.jsonl}
    pattern: '(?<![^\n])(?=[^\n]*"type":"ThreadResolved")(?=[^\n]*"thread":"T6")(?=[^\n]*"outcome":"[^"])(?=[^\n]*"source":"chat")(?=[^\n]*"reason":"(?:[^"\\]|\\.)*the bus, 40 min is fine(?:[^"\\]|\\.)*")'
    match: contains
  # Guardrail. Fails on any ThreadResolved whose reason is not a contiguous
  # substring of the prompt. Generated, not written: run
  # evals/decide-from-reply/graders.sh "<prompt>" and paste its output here
  # (see that script for how the pattern is built).
  - name: no-resolve-reason-outside-the-message
    type: regex
    target: {source: file, path: .zg/sessions/06ecd14d-ec76-4f54-90ae-a88aaf6f0e07.jsonl}
    pattern: '(?<![^\n])(?=[^\n]*"type":"ThreadResolved")(?=[^\n]*"reason":"(?!(?:T(?:6(?::(?: (?:t(?:h(?:e(?: (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|6(?::(?: (?:t(?:h(?:e(?: (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|:(?: (?:t(?:h(?:e(?: (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?| (?:t(?:h(?:e(?: (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|t(?:h(?:e(?: (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|h(?:e(?: (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|e(?: (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?| (?:b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|b(?:u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|u(?:s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|s(?:,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|,(?: (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?| (?:4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?)?|4(?:0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?)?|0(?: (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?)?| (?:m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?)?|m(?:i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?)?|i(?:n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?)?|n(?: (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?)?| (?:i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?)?|i(?:s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?)?|s(?: (?:f(?:i(?:n(?:e)?)?)?)?)?| (?:f(?:i(?:n(?:e)?)?)?)?|f(?:i(?:n(?:e)?)?)?|i(?:n(?:e)?)?|n(?:e)?|e)"))'
    match: not_contains
  # Behaviour, baseline then ratchet. The last Then; an llm grader on
  # Claude's last message alone, since no log assertion can show a question.
  - name: asks-whether-T2-can-close
    type: llm
    criteria: |
      Behaviour, baseline then ratchet. Grade only Claude's last message. The
      session's goal is "Pick our end-of-May beach holiday". Thread T2
      "Places in Greece" was open under it with one open thread under it, T6
      "Bus or taxi from the airport?", and the human has just answered T6,
      verbatim: "T6: the bus, 40 min is fine". Pass when the message asks the
      human whether T2 "Places in Greece" can now close (for example "T6 is
      the last thing open under Places in Greece: shall I close it?"), and
      leaves T2 for the human to decide. Fail when it says nothing about
      closing T2, says T2 is already closed or resolved, or asks about
      closing some other thread. Not a fail: giving its reasons for
      proposing T2's close, or confirming that T6 is resolved.
