schema_version: "1.1"
name: batch-close-partial-yes
description: Claude's last message in the recorded session proposes dropping D1.1 "Greek village" and closing T4 "Boat tour on day 3?", and the human answers "drop D1.1, keep T4 for now". Claude cancels D1.1 with source chat and a reason holding the human's words, and leaves T4 open. Guardrails are T4 never resolved, cancelled or merged, and no cancel or resolve reason outside the human's message. Its behaviour is D1.1's cancellation from chat with the human's words. The case has no no-plugin arm, because the runner yields only the with arm for a resumed case, so its baseline is the with arm. Not exercised - the setup turns (recorded, steered by setup prompts, not live), and Claude's own proposal to drop D1.1 and close T4 (it is in the recorded history, which ends on it, so how Claude comes to propose the batch is covered by zg-bam.6.3, zg-bam.6.4 and zg-bam.6.5).
tags: [guardrail, slice-4, propagation]
runs: 5
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: "drop D1.1, keep T4 for now"
  max_turns: 10
  allowed_tools:
    [
      mcp__zg__decision,
      mcp__zg__criterion,
      mcp__zg__node,
      mcp__zg__thread,
      mcp__zg__show,
    ]
graders:
  # Guardrail. T4 stays open: the human asked to keep it. No ThreadResolved,
  # NodeCancelled or NodeMerged (T4 as a source) names it. The
  # closing quote keeps T4 from matching T40.
  - name: T4-still-open
    type: regex
    target: {source: file, path: .zg/sessions/f11a1e79-1e8a-4eab-9f70-9a9bcb268e99.jsonl}
    pattern: '(?<![^\n])(?=[^\n]*"type":"(?:ThreadResolved|NodeCancelled|NodeMerged)")(?=[^\n]*(?:"(?:thread|node)":"T4"|"from":\[(?:[^\]]*,)?"T4"))'
    match: not_contains
  # Behaviour, baseline then ratchet. D1.1 is cancelled from chat, with a
  # reason that holds the human's words for it.
  - name: D1.1-cancelled-from-chat-with-the-humans-words
    type: regex
    target: {source: file, path: .zg/sessions/f11a1e79-1e8a-4eab-9f70-9a9bcb268e99.jsonl}
    pattern: '(?<![^\n])(?=[^\n]*"type":"NodeCancelled")(?=[^\n]*"node":"D1\.1")(?=[^\n]*"source":"chat")(?=[^\n]*"reason":"(?:[^"\\]|\\.)*drop D1\.1(?:[^"\\]|\\.)*")'
    match: contains
  # Guardrail. Fails on any ThreadResolved or NodeCancelled whose reason is
  # not a contiguous substring of the prompt. Generated, not written: run
  # evals/decide-from-reply/graders.sh "<prompt>" "ThreadResolved|NodeCancelled"
  # and paste its output here (see that script for how the pattern is built).
  - name: no-resolve-reason-outside-the-message
    type: regex
    target: {source: file, path: .zg/sessions/f11a1e79-1e8a-4eab-9f70-9a9bcb268e99.jsonl}
    pattern: '(?<![^\n])(?=[^\n]*"type":"(?:ThreadResolved|NodeCancelled)")(?=[^\n]*"reason":"(?!(?:d(?:r(?:o(?:p(?: (?:D(?:1(?:\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|r(?:o(?:p(?: (?:D(?:1(?:\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|o(?:p(?: (?:D(?:1(?:\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|p(?: (?:D(?:1(?:\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?| (?:D(?:1(?:\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|D(?:1(?:\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|1(?:\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|\.(?:1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|1(?:,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|,(?: (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?| (?:k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?|k(?:e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?)?|e(?:e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?)?|e(?:p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?)?|p(?: (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?)?| (?:T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?)?|T(?:4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?)?|4(?: (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?)?| (?:f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?)?|f(?:o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?)?|o(?:r(?: (?:n(?:o(?:w)?)?)?)?)?|r(?: (?:n(?:o(?:w)?)?)?)?| (?:n(?:o(?:w)?)?)?|n(?:o(?:w)?)?|o(?:w)?|w)"))'
    match: not_contains
