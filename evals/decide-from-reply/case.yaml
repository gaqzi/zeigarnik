schema_version: "1.1"
name: decide-from-reply
description: The human answers T5, Claude's own question about a two-hour bus transfer, with a refusal that also states a constraint. Claude records the answer as the human's reply on T5, resolves T5 with an outcome and the human's words as the reason (source chat), and adds the constraint as a criterion on D1 with T5 as its origin. Nothing is recorded as a decision, so no DecisionOpened, OptionAdded or DecisionMade is appended (zg-wn9, zg-579). Guardrails are those three events never appended, T5 resolved from chat with the words in its reason, and a resolve reason that is a contiguous piece of the message, so nothing is invented (the second does not judge whether a piece cuts the words short, and the outcome Claude writes is not checked, zg-b8o). Behaviours are the criterion on D1 from T5 and the T5 reply. The case has no no-plugin arm, because the runner yields only the with arm for a resumed case, so its baseline is the with arm. Not exercised - the asking turn (T5's question was Claude's and is in the recorded history; the human's answer is the prompt), the setup turns (recorded, steered by setup prompts, not live), a limit that serves no decision (limit-without-decision), a reply that narrows a thread without answering it (reply-attribution), propagation after the criterion (slice 4), and a human who answers with a hedge or without a choice (no-decision-without-words).
tags: [guardrail, slice-3, decisions]
runs: 5
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: "T5: no, two hours with the kids is a no. Keep transfers under 30 min."
  max_turns: 10
  allowed_tools:
    [
      mcp__zg__decision,
      mcp__zg__criterion,
      mcp__zg__node,
      mcp__zg__thread,
      mcp__zg__show,
    ]
graders:
  # Guardrail. Nothing is recorded as a decision: the fixture holds D1 and no
  # option, so any OptionAdded or DecisionMade, and any DecisionOpened other
  # than D1's, was appended in the run. Every graded line is picked by
  # per-line lookaheads on its fields ((?<![^\n]) is the line start), so the
  # order of fields within an event line does not matter.
  - name: no-decision-opened-optioned-or-made
    type: regex
    target: {source: file, path: .zg/sessions/61986d10-7dbd-4c1f-97cf-669f92597f71.jsonl}
    pattern: '(?<![^\n])(?:(?=[^\n]*"type":"(?:OptionAdded|DecisionMade)")|(?=[^\n]*"type":"DecisionOpened")(?![^\n]*"decision":"D1"))'
    match: not_contains
  # Guardrail. T5 resolves from the human's chat words: source chat, the
  # phrase inside the reason, an outcome given. A key such as "reason":" cannot
  # match inside another string, where its quotes are escaped.
  - name: T5-resolved-with-the-humans-words
    type: regex
    target: {source: file, path: .zg/sessions/61986d10-7dbd-4c1f-97cf-669f92597f71.jsonl}
    pattern: '(?<![^\n])(?=[^\n]*"type":"ThreadResolved")(?=[^\n]*"thread":"T5")(?=[^\n]*"outcome":"[^"])(?=[^\n]*"source":"chat")(?=[^\n]*"reason":"(?:[^"\\]|\\.)*two hours with the kids is a no(?:[^"\\]|\\.)*")'
    match: contains
  # Guardrail. Reused by slice 4. Fails on any ThreadResolved whose reason is
  # not a contiguous substring of the prompt. The alternation lists every
  # substring of the prompt as a prefix of one of its suffixes, each prefix
  # chain nested right (a(?:b(?:c)?)?), regex metacharacters escaped. The
  # pattern is generated: run evals/decide-from-reply/graders.sh (it prints
  # the pattern for the case's prompt, or for the prompt given as its
  # argument, and an event type and field) and paste the output here. The
  # admissible reason must be followed by its closing quote. An empty reason
  # cannot occur (the tools refuse it).
  - name: no-resolve-reason-outside-the-message
    type: regex
    target: {source: file, path: .zg/sessions/61986d10-7dbd-4c1f-97cf-669f92597f71.jsonl}
