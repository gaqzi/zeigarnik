schema_version: "1.1"
name: decide-from-reply
description: The human answers T5, Claude's own question about a two-hour bus transfer, with a refusal that also states a constraint. Claude records the answer as one decision opened under T5 with its option and the decision made in one step (source chat, the human's words as the reason), adds the constraint as a criterion on D1 with that decision as its origin, and records the human's T5 block as their reply on T5. Guardrails are exactly one DecisionMade with source chat holding the words verbatim, and a reason that is a contiguous piece of the message, so nothing is invented (the second does not judge whether a piece cuts the words short, and the option or title Claude names is not checked, zg-b8o). Behaviours are the three recorded effects. The case has no no-plugin arm, because the runner yields only the with arm for a resumed case, so its baseline is the with arm. Not exercised - the asking turn (T5's question was Claude's and is in the recorded history; the human's answer is the prompt), the setup turns (recorded, steered by setup prompts, not live), propagation after the decision (slice 4), and a human who answers with a hedge or without a choice (no-decision-without-words).
tags: [guardrail, slice-3, decisions]
runs: 5
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: "T5: no, two hours with the kids is a no. Keep transfers under 30 min."
  max_turns: 10
  allowed_tools:
    [
      mcp__zg__decision,
      mcp__zg__criterion,
      mcp__zg__node,
      mcp__zg__thread,
      mcp__zg__show,
    ]
graders:
  # Guardrail. Slice 4's propagation cases reuse this one and the next; keep
  # their names stable. Exactly one DecisionMade: the start anchor
  # (?<![\s\S]) pins the match to the start of the file, the negative
  # lookahead fails on two or more, the positive lookahead fails on none and
  # requires the one to have source chat and the phrase inside its reason.
  # Every graded line is picked by per-line lookaheads on its fields
  # ((?<![^\n]) is the line start), so the order of fields within an event
  # line does not matter. A key such as "reason":" cannot match inside
  # another string, where its quotes are escaped.
  - name: exactly-one-decision-from-the-humans-words
    type: regex
    target: {source: file, path: .zg/sessions/61986d10-7dbd-4c1f-97cf-669f92597f71.jsonl}
    pattern: '(?<![\s\S])(?![\s\S]*"type":"DecisionMade"[\s\S]*"type":"DecisionMade")(?=[\s\S]*(?<![^\n])(?=[^\n]*"type":"DecisionMade")(?=[^\n]*"source":"chat")(?=[^\n]*"reason":"(?:[^"\\]|\\.)*two hours with the kids is a no(?:[^"\\]|\\.)*"))'
    match: contains
  # Guardrail. Reused by slice 4. Fails on any DecisionMade whose reason is not
  # a contiguous substring of the prompt. The alternation lists every
  # substring of the prompt as a prefix of one of its suffixes, each prefix
  # chain nested right (a(?:b(?:c)?)?), regex metacharacters escaped. The
  # pattern is generated: run evals/decide-from-reply/graders.sh (it prints
  # the pattern for the case's prompt, or for the prompt given as its
  # argument) and paste the output here. The admissible reason must be
  # followed by its closing quote. An empty reason cannot occur (the tools
  # refuse it).
  - name: no-decision-reason-outside-the-message
    type: regex
    target: {source: file, path: .zg/sessions/61986d10-7dbd-4c1f-97cf-669f92597f71.jsonl}
