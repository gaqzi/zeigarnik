schema_version: "1.1"
name: close-cancelled
description: The human cancels the goal and its action without giving a reason. Claude records their words only, invents no reason, writes the handoff right away in the human's voice, and shows it.
tags: [guardrail, close]
runs: 5
context:
  history_file: history.jsonl
  scaffold_script: scaffold.sh
execution:
  prompt: /zg:close Cancel it, and the venue too. I'd rather not say why.
  max_turns: 8
  allowed_tools:
    [mcp__zg__close_goal, mcp__zg__action, mcp__zg__handoff, mcp__zg__show]
graders:
  - name: goal-cancelled-with-the-humans-words
    type: regex
    target: {source: file, path: .zg/sessions/84484670-58dd-40e4-b4e5-f49aca88d32b.jsonl}
    pattern: '"type":"GoalCancelled"[^\n]*"agreement":"[^"]*(Cancel it|[Rr]ather not say why)'
    match: contains
  - name: action-cancelled
    type: regex
    target: {source: file, path: .zg/sessions/84484670-58dd-40e4-b4e5-f49aca88d32b.jsonl}
    pattern: '"type":"ActionCancelled"[^\n]*"action":"A1"'
    match: contains
  - name: cancels-carry-no-reason
    type: regex
    target: {source: file, path: .zg/sessions/84484670-58dd-40e4-b4e5-f49aca88d32b.jsonl}
    pattern: '"type":"(GoalCancelled|ActionCancelled)"[^\n]*"reason"'
    match: not_contains
  - name: handoff-written
    type: regex
    target: {source: file, path: .zg/sessions/84484670-58dd-40e4-b4e5-f49aca88d32b.jsonl}
    pattern: '"type":"HandoffWritten"'
    match: contains
  - name: handoff-next-not-third-person
    type: tool_used
    tool: mcp__zg__handoff
    input_match: '"next":\s*"[^"]*\b[Tt]he (user|human)\b'
    min: 0
    max: 0
  - name: handoff-shown-about-what-to-do-instead
    type: llm
    criteria: |
      Claude's last message shows the handoff it has already written. Its
      next goal opens a conversation about what to do instead of the offsite
      plan (for example, deciding how to start over); a next goal of "none",
      "not set", or empty fails. Offering to change the handoff is fine. The
      next goal and decisions are pasted into the next session as the
      human's own message, so they must be in the human's voice: "I" is the
      human and "you" is Claude, never "the user" or "the human" in the third
      person (for example "cancelled because the user changed their mind").
      Claude's own words around the handoff may say either.
